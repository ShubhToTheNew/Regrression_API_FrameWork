# Environment: Prod / UAT / Stage
Environment=UAT

# Base URLs
OTT_Prod_Base_Url=https://tb.tapi.videoready.tv
OTT_UAT_Base_Url=https://uat-tb.tapi.videoready.tv
OTT_Stage_Base_Url=https://tatasky-staging-kong.videoready.tv
androidAppVersion=4.2.46
iosAppVersion=4.3.23
webAppVersion=1.0.0

# Token manager (cache TTL, refresh buffer, exponential backoff for token API calls)
tokenRefreshBufferSeconds=60
oauthTokenDefaultTtlSeconds=3600
userSessionDefaultTtlSeconds=1800
tokenRetryMaxAttempts=3
tokenRetryInitialDelayMs=500
tokenRetryMaxDelayMs=8000